<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>VMG Intelligence — Secure Access</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:22px">
    <section class="panel card" style="width:min(430px,100%);padding:26px">
      <div class="eyebrow">VMG internal intelligence</div>
      <h1 style="margin:8px 0 6px;font-size:27px">Secure access</h1>
      <p style="color:var(--muted);line-height:1.6;margin:0 0 20px">Enter the VMG Intelligence access secret. It is sent only to the server and is not stored in browser storage.</p>
      <form id="loginForm" class="settings-form">
        <div class="field"><label for="accessSecret">Access secret</label><input class="input" id="accessSecret" type="password" autocomplete="current-password" required autofocus></div>
        <div id="loginMessage" class="notice info" hidden></div>
        <button class="btn primary" id="loginBtn" type="submit">Login</button>
      </form>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
