name: One-time Contact reliability wiring

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-contact-reliability.yml

permissions:
  contents: write

jobs:
  patch-contact:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/hotfix/production-ui-fixes-24aug'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Patch Contact page only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('contact.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Load the dedicated Contact reliability styles once.
          marker = '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.5.12/build/css/intlTelInput.min.css">'
          reliability = marker + '\n  <link rel="stylesheet" href="/assets/css/contact-form-reliability.css?v=20260904a">'
          if '/assets/css/contact-form-reliability.css' not in s:
              assert marker in s, 'intl-tel-input CSS marker missing'
              s = s.replace(marker, reliability, 1)

          # Field quality/length limits.
          s = s.replace('id="fullname" name="fullname" placeholder="Full name" required>',
                        'id="fullname" name="fullname" placeholder="Full name" minlength="2" maxlength="80" required aria-describedby="fullname-error">', 1)
          s = s.replace('<span class="error" aria-live="polite">Please enter full name.</span>',
                        '<span class="error" id="fullname-error" aria-live="polite">Please enter full name.</span>', 1)

          s = s.replace('autocomplete="tel" required>',
                        'autocomplete="tel" required aria-describedby="contact-error">', 1)
          s = s.replace('<span class="error" aria-live="polite">Not a valid phone number.</span>',
                        '<span class="error" id="contact-error" aria-live="polite">Please enter a valid phone number.</span>', 1)

          s = s.replace('id="emailID" name="EmailID" placeholder="Email ID" required>',
                        'id="emailID" name="EmailID" placeholder="Email ID" maxlength="254" required aria-describedby="emailID-error">', 1)
          s = s.replace('<span class="error" aria-live="polite">Please enter email.</span>',
                        '<span class="error" id="emailID-error" aria-live="polite">Please enter email.</span>', 1)

          s = s.replace('<select id="country" name="country" required>',
                        '<select id="country" name="country" required aria-required="true" aria-describedby="country-error">', 1)
          s = s.replace('<span class="error" aria-live="polite">Please select country.</span>',
                        '<span class="error" id="country-error" aria-live="polite">Please select country.</span>', 1)

          s = s.replace('id="organization" name="organization" placeholder="Organization">',
                        'id="organization" name="organization" placeholder="Organization" maxlength="120" aria-describedby="organization-error">', 1)
          s = s.replace('<span class="error" aria-live="polite">Please enter organization.</span>',
                        '<span class="error" id="organization-error" aria-live="polite"></span>', 1)

          # Type is mandatory and source markup matches the runtime values.
          old_type = '''<label for="type">Type</label>\n                <select id="type" name="type">\n                  <option value="">Select type</option>\n                  <option value="buyer">Buyer</option>\n                  <option value="seller">Seller</option>\n                  <option value="investor">Investor</option>\n                  <option value="finance">Finance</option>\n                  <option value="other">Other</option>\n                </select>\n                <span class="error" aria-live="polite">Please select category.</span>'''
          new_type = '''<label for="type">Type *</label>\n                <select id="type" name="type" required aria-required="true" aria-describedby="type-error">\n                  <option value="">Select enquiry type</option>\n                  <option value="buyer">Buyer / Purchase Requirement</option>\n                  <option value="seller">Supplier / Material Offer</option>\n                  <option value="quotation">Bulk Quotation / Market Enquiry</option>\n                  <option value="partnership">Business Partnership</option>\n                  <option value="documentation">Documentation / Shipment Support</option>\n                  <option value="callback">Call Back Request</option>\n                  <option value="investor">Investor</option>\n                  <option value="finance">Finance</option>\n                  <option value="general">General Enquiry</option>\n                </select>\n                <span class="error" id="type-error" aria-live="polite">Please select an enquiry type.</span>'''
          assert old_type in s, 'Type source block missing'
          s = s.replace(old_type, new_type, 1)

          s = s.replace('id="message" name="message" rows="4" placeholder="Type your query here..." required>',
                        'id="message" name="message" rows="4" placeholder="Type your query here..." minlength="10" maxlength="3000" required aria-describedby="message-error">', 1)
          s = s.replace('<span class="error" aria-live="polite">Please enter your message.</span>',
                        '<span class="error" id="message-error" aria-live="polite">Please enter your message.</span>', 1)

          s = s.replace('id="privacy" name="privacy" required>',
                        'id="privacy" name="privacy" required aria-describedby="privacy-error">', 1)
          s = s.replace('href="#" class="privacy-link">Privacy Policy</a>',
                        'href="/privacy-policy.html" class="privacy-link">Privacy Policy</a>', 1)
          s = s.replace('<span class="error" aria-live="polite">Please accept the privacy policy to continue.</span>',
                        '<span class="error" id="privacy-error" aria-live="polite">Please accept the privacy policy to continue.</span>', 1)

          # Honeypot + timing + Turnstile. These are part of the Contact form only.
          anchor = '''            <button type="submit" class="btn-animated submit submit-btn">Submit</button>'''
          security_markup = '''            <div class="vmg-honeypot-field" aria-hidden="true">\n              <label for="website">Website</label>\n              <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">\n            </div>\n            <input type="hidden" id="formStartedAt" name="formStartedAt" value="">\n\n            <div class="form-field full-width vmg-turnstile-field">\n              <div id="contact-turnstile" class="vmg-turnstile" aria-label="Security verification"></div>\n              <span class="error" id="contact-turnstile-error" aria-live="polite"></span>\n            </div>\n\n''' + anchor
          assert anchor in s, 'Submit button anchor missing'
          s = s.replace(anchor, security_markup, 1)

          # Delete every legacy Contact inline initializer/submission/sync block and
          # stop loading main.js on Contact. Config remains the header/footer owner.
          scripts_pattern = re.compile(
              r'  <script src="/assets/js/config\.js\?v=[^"]+"></script>.*?</body>',
              re.S
          )
          scripts_replacement = '''  <script src="/assets/js/config.js?v=20260904c"></script>\n  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.5.12/build/js/intlTelInput.min.js"></script>\n  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>\n  <script src="/assets/js/contact-page-shell.js?v=20260904a"></script>\n  <script src="/assets/js/contact-form.js?v=20260904a"></script>\n</body>'''
          s, count = scripts_pattern.subn(scripts_replacement, s, count=1)
          assert count == 1, 'Legacy script tail was not replaced exactly once'

          # Sanity checks: one phone owner, no legacy Contact main.js/inline blocks.
          assert 'assets/js/main.js' not in s
          assert 'Direct intl-tel-input initialization with two-way sync' not in s
          assert 'Google Sheets Integration Script' not in s
          assert 'FIXED: Country code display update script' not in s
          assert s.count('intlTelInput.min.js') == 1
          assert s.count('/assets/js/contact-form.js') == 1
          assert s.count('id="contact-turnstile"') == 1
          assert s != original

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scope and syntax
        run: |
          git diff --check
          git status --short
          git diff --stat
          grep -q 'assets/js/contact-form.js' contact.html
          grep -q 'id="contact-turnstile"' contact.html
          ! grep -q 'assets/js/main.js' contact.html
          test "$(grep -o 'intlTelInput.min.js' contact.html | wc -l)" -eq 1

      - name: Commit patched Contact page and remove one-time workflow
        run: |
          rm .github/workflows/one-time-contact-reliability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html .github/workflows/one-time-contact-reliability.yml
          git commit -m "Wire single-owner Contact reliability flow"
          git push origin HEAD:hotfix/production-ui-fixes-24aug
