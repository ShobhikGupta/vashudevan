name: PR12 disable legacy popup

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/pr12-disable-legacy-popup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Disable legacy popup entry point
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/js/main.js')
          text = path.read_text(encoding='utf-8')
          old = "window.initOpeningPopup = function initOpeningPopup(){"
          new = "window.initLegacyOpeningPopup = function initLegacyOpeningPopup(){"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy popup entry point, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check assets/js/main.js
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/main.js
          git commit -m 'Disable legacy opening popup renderer'
          git push origin HEAD:hotfix/production-ui-fixes-24aug
