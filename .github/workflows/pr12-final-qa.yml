name: PR12 final browser QA

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/pr12-final-qa.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Static syntax and diff checks
        run: |
          node --check assets/js/contact-form.js
          node --check assets/js/config.js
          node --check assets/js/contact-page-shell.js
          node --check assets/js/vmg-submit-state.js
          node --check assets/js/vmg-feedback.js
          node --check assets/js/vmg-footer.js
          git diff --check origin/main...HEAD
          ! grep -q "syncPhoneToCountry" assets/js/contact-form.js
          ! grep -q "textContent = '—'" assets/js/contact-form.js
          grep -q "iti.promise" assets/js/contact-form.js
          grep -q "MAX_ATTACHMENTS = 10" assets/js/contact-form.js
          grep -q "25 \* 1024 \* 1024" assets/js/contact-form.js
          grep -q "MAX_SINGLE_ATTACHMENT_BYTES = 10" assets/js/contact-form.js
          grep -q "vmg:contact-countries-ready" assets/js/contact-form.js
          grep -q "data-vmg-country-ready" assets/js/config.js
          grep -q "I have read the <a href=\"/privacy-policy.html\" class=\"privacy-link\">Privacy Policy</a> and agree to Vashudevan MetGlobal LLP processing the information and attachments I submit to respond to my enquiry." assets/js/contact-page-shell.js

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run browser QA
        run: |
          python3 -m http.server 8000 >/tmp/vmg-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/pr12-qa.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');

          const pages = [
            '/index.html','/who-we-are.html','/our-impact.html','/products.html','/product.html',
            '/resources.html','/faq.html','/contact.html','/privacy-policy.html','/disclaimer.html','/market-prices/'
          ];

          const report = { phone:{}, attachments:{}, submit:{}, header:{}, errors:[] };
          const delay = ms => new Promise(r => setTimeout(r, ms));

          async function makePage(browser, reducedMotion) {
            const page = await browser.newPage({ viewport:{width:1440,height:900}, reducedMotion: reducedMotion || 'no-preference' });
            page.on('pageerror', e => report.errors.push(String(e)));
            await page.addInitScript(() => {
              const RealResponse = window.Response;
              window.fetch = function() {
                return new Promise(resolve => setTimeout(() => resolve(new RealResponse(JSON.stringify({success:true}), {
                  status:200, headers:{'Content-Type':'application/json'}
                })), 260));
              };
              window.turnstile = {
                render: function(host, options) {
                  host.innerHTML = '<div data-test-turnstile="true">Test security verification</div>';
                  setTimeout(() => options.callback && options.callback('qa-test-token'), 10);
                  return 'qa-widget';
                },
                reset: function() {}
              };
            });
            await page.route('https://challenges.cloudflare.com/turnstile/**', route => route.fulfill({status:200, contentType:'application/javascript', body:''}));
            return page;
          }

          async function openContact(page) {
            await page.goto('http://127.0.0.1:8000/contact.html', {waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => document.getElementById('country')?.dataset.vmgCountryReady === 'true', null, {timeout:10000});
            await page.waitForFunction(() => document.querySelector('#country + .vmg-custom-select .vmg-custom-select-label')?.textContent.trim() === 'India', null, {timeout:5000});
            await page.waitForTimeout(80);
          }

          async function attachmentScenario(page, files) {
            await openContact(page);
            await page.locator('#attachments').setInputFiles(files);
            await page.waitForTimeout(60);
            return await page.evaluate(() => ({
              chips: document.querySelectorAll('.vmg-attachment-chip').length,
              error: document.getElementById('attachments-error')?.textContent.trim() || '',
              shown: document.getElementById('attachments-error')?.classList.contains('show') || false
            }));
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await makePage(browser);

            // Contact country + phone QA.
            await openContact(page);
            const initial = await page.evaluate(() => ({
              native: document.getElementById('country').value,
              visible: document.querySelector('#country + .vmg-custom-select .vmg-custom-select-label')?.textContent.trim(),
              dial: document.getElementById('contact-dial-code').textContent.trim(),
              phone: document.getElementById('contact').value,
              count: Number(document.getElementById('country').dataset.vmgCountryCount || 0),
              all: [...document.getElementById('country').options].filter(o=>o.value).map(o=>({iso2:o.value,name:o.textContent.trim(),dial:o.dataset.dialCode||''}))
            }));
            const missing = initial.all.filter(x => !/^[a-z]{2}$/.test(x.iso2) || !x.name || !x.dial);
            report.phone.initial = initial;
            report.phone.missingDialCount = missing.length;
            if (initial.native !== 'in' || initial.visible !== 'India' || initial.dial !== '+91' || initial.phone !== '') throw new Error('Initial India state failed '+JSON.stringify(initial));
            if (!initial.count || missing.length) throw new Error('Country metadata coverage failed count='+initial.count+' missing='+missing.length);

            const dialTests = [['in','+91'],['fr','+33'],['is','+354'],['gb','+44'],['us','+1'],['ae','+971'],['mu','+230'],['sg','+65'],['au','+61'],['cn','+86'],['in','+91']];
            report.phone.dials = [];
            for (const [iso,expected] of dialTests) {
              await page.selectOption('#country', iso);
              await page.waitForTimeout(20);
              const got = await page.locator('#contact-dial-code').textContent();
              report.phone.dials.push({iso,expected,got:got.trim(),pass:got.trim()===expected});
              if (got.trim() !== expected) throw new Error('Dial '+iso+' expected '+expected+' got '+got.trim());
            }

            // Every selectable country must resolve a dial and never render em dash.
            let allDialFailures = [];
            for (const entry of initial.all) {
              await page.selectOption('#country', entry.iso2);
              const got = (await page.locator('#contact-dial-code').textContent()).trim();
              if (!got || got === '—' || got !== '+' + entry.dial) allDialFailures.push({iso2:entry.iso2,expected:'+'+entry.dial,got});
            }
            report.phone.allDialFailures = allDialFailures;
            if (allDialFailures.length) throw new Error('All-country dial QA failures '+JSON.stringify(allDialFailures.slice(0,5)));

            // Phone must never reverse-control Country.
            await page.selectOption('#country','fr');
            await page.fill('#contact','+919316571362');
            await page.dispatchEvent('#contact','input');
            const reverse = await page.evaluate(() => ({country:document.getElementById('country').value,dial:document.getElementById('contact-dial-code').textContent.trim()}));
            report.phone.reverseControl = reverse;
            if (reverse.country !== 'fr' || reverse.dial !== '+33') throw new Error('Phone reverse-controlled country '+JSON.stringify(reverse));

            // Indian 9316571362 must pass actual form phone validation. Stub backend only after validation.
            await page.selectOption('#country','in');
            await page.fill('#fullname','QA Test User');
            await page.fill('#emailID','qa@example.com');
            await page.fill('#contact','9316571362');
            await page.selectOption('#type','general');
            await page.fill('#message','This is a valid browser QA enquiry message.');
            await page.check('#privacy');
            await page.evaluate(() => { window.AppConfig.contactSecurityReady = true; window.AppConfig.contactEndpoint='https://example.test/contact'; });
            await page.waitForTimeout(1200);
            await page.locator('#contact-form .submit-btn').click();
            await page.waitForFunction(() => document.querySelector('#contact-form .submit-btn')?.classList.contains('is-submitting'), null, {timeout:5000});
            report.submit.contactLoading = true;
            await page.waitForFunction(() => document.querySelector('#contact-form .submit-btn')?.classList.contains('is-success'), null, {timeout:7000});
            report.submit.contactSuccess = true;
            report.phone.indianNumberValid = !(await page.locator('#contact-error').evaluate(el => el.classList.contains('show')));
            if (!report.phone.indianNumberValid) throw new Error('Indian number was rejected');

            // Attachments.
            const tiny = n => ({name:'file-'+n+'.jpg', mimeType:'image/jpeg', buffer:Buffer.alloc(1024,1)});
            report.attachments.one = await attachmentScenario(page,[tiny(1)]);
            report.attachments.five = await attachmentScenario(page,Array.from({length:5},(_,i)=>tiny(i)));
            report.attachments.ten = await attachmentScenario(page,Array.from({length:10},(_,i)=>tiny(i)));
            report.attachments.eleven = await attachmentScenario(page,Array.from({length:11},(_,i)=>tiny(i)));
            report.attachments.total249 = await attachmentScenario(page,[
              {name:'a.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(8.3*1024*1024|0,1)},
              {name:'b.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(8.3*1024*1024|0,1)},
              {name:'c.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(8.3*1024*1024|0,1)}
            ]);
            report.attachments.over25 = await attachmentScenario(page,[
              {name:'a.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(9*1024*1024,1)},
              {name:'b.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(9*1024*1024,1)},
              {name:'c.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(9*1024*1024,1)}
            ]);
            report.attachments.over10single = await attachmentScenario(page,[{name:'big.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(10*1024*1024+1,1)}]);
            report.attachments.exe = await attachmentScenario(page,[{name:'bad.exe',mimeType:'application/x-msdownload',buffer:Buffer.from('MZ')}]);
            if (report.attachments.one.chips !== 1 || report.attachments.five.chips !== 5 || report.attachments.ten.chips !== 10) throw new Error('Allowed attachment count QA failed');
            if (!report.attachments.eleven.shown || !report.attachments.over25.shown || !report.attachments.over10single.shown || !report.attachments.exe.shown) throw new Error('Attachment rejection QA failed');
            if (report.attachments.total249.chips !== 3 || report.attachments.total249.shown) throw new Error('24.9 MB attachment QA failed');

            // Shared Popup / Feedback / Footer state transitions on homepage.
            await page.goto('http://127.0.0.1:8000/index.html', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2300);
            await page.waitForSelector('.opening-popup-form');
            await page.selectOption('#op-country','india');
            await page.fill('#op-phone','9316571362');
            await page.fill('#op-email','qa@example.com');
            await page.locator('.opening-popup-submit').click();
            await page.waitForFunction(() => document.querySelector('.opening-popup-submit')?.classList.contains('is-submitting'), null, {timeout:3000});
            report.submit.popupLoading = true;
            await page.waitForFunction(() => document.querySelector('.opening-popup-submit')?.classList.contains('is-success'), null, {timeout:4000});
            report.submit.popupSuccess = true;

            // Close popup if still present, then Feedback.
            const close = page.locator('.opening-popup-close');
            if (await close.count()) await close.click().catch(()=>{});
            await page.waitForTimeout(100);
            await page.locator('.vmg-feedback-trigger-desktop').first().click();
            await page.locator('.vmg-feedback-rating[data-rating="Good"]').click();
            await page.fill('#vmg-feedback-comments','Browser QA feedback message.');
            await page.locator('.vmg-feedback-submit').click();
            await page.waitForFunction(() => document.querySelector('.vmg-feedback-submit')?.classList.contains('is-submitting'), null, {timeout:3000});
            report.submit.feedbackLoading = true;
            await page.waitForFunction(() => document.querySelector('.vmg-feedback-submit')?.classList.contains('is-success'), null, {timeout:4000});
            report.submit.feedbackSuccess = true;
            await page.waitForTimeout(1450);

            const footerForm = page.locator('[data-vmg-subscribe-form]');
            await footerForm.locator('input[type="email"]').fill('qa@example.com');
            await footerForm.locator('.vmg-footer-subscribe-button').click();
            await page.waitForFunction(() => document.querySelector('.vmg-footer-subscribe-button')?.classList.contains('is-submitting'), null, {timeout:3000});
            report.submit.footerLoading = true;
            await page.waitForFunction(() => document.querySelector('.vmg-footer-subscribe-button')?.classList.contains('is-success'), null, {timeout:4000});
            report.submit.footerSuccess = true;

            // Header/footer consistency across public pages at 1440px.
            for (const path of pages) {
              await page.goto('http://127.0.0.1:8000'+path, {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(350);
              const state = await page.evaluate(() => {
                const fb = document.querySelector('.vmg-feedback-trigger-desktop');
                const links = [...document.querySelectorAll('.vmg-nav-social-icons .vmg-social-link')];
                const mid = el => { const r=el.getBoundingClientRect(); return r.top+r.height/2; };
                const mids = fb && links.length ? [mid(fb),...links.map(mid)] : [];
                const cs = fb ? getComputedStyle(fb) : null;
                return {
                  feedbackBackground: cs?.backgroundColor || '',
                  feedbackColor: cs?.color || '',
                  maxMidDelta: mids.length ? Math.max(...mids)-Math.min(...mids) : 999,
                  header: !!document.querySelector('.site-header.vmg-econship-header'),
                  footer: !!document.querySelector('footer.vmg-global-footer, footer.site-footer'),
                  navStyle: !!document.querySelector('link[data-vmg-nav-premium]'),
                  footerStyle: !!document.querySelector('link[data-vmg-footer-style]'),
                  logo: document.querySelector('.vmg-updated-header-logo')?.getAttribute('src') || ''
                };
              });
              report.header[path] = state;
              if (state.feedbackBackground !== 'rgb(10, 23, 40)' || state.feedbackColor !== 'rgb(255, 255, 255)') throw new Error('Feedback color deviation '+path+' '+JSON.stringify(state));
              if (state.maxMidDelta > 1.01) throw new Error('Header centerline deviation '+path+' '+state.maxMidDelta);
              if (!state.header || !state.footer || !state.navStyle || !state.footerStyle || !state.logo.includes('vmg-header-logo.svg')) throw new Error('Header/footer shell deviation '+path+' '+JSON.stringify(state));
            }

            // Reduced-motion fallback is shared for all prepared buttons.
            const reduced = await makePage(browser,'reduce');
            await reduced.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
            await reduced.waitForTimeout(2300);
            const reducedResult = await reduced.evaluate(() => {
              const buttons = [
                document.querySelector('.opening-popup-submit'),
                document.querySelector('.vmg-feedback-submit'),
                document.querySelector('.vmg-footer-subscribe-button')
              ].filter(Boolean);
              return buttons.map(b => {
                window.VMGSubmitState.set(b,'loading');
                const loading=b.textContent.trim();
                window.VMGSubmitState.set(b,'success');
                const success=b.textContent.trim();
                window.VMGSubmitState.set(b,'idle');
                return {loading,success};
              });
            });
            report.submit.reducedMotion = reducedResult;
            if (reducedResult.some(x => x.loading !== 'Sending…' || x.success !== '✓ Sent')) throw new Error('Reduced-motion shared state failed');
            await reduced.close();

            fs.writeFileSync('/tmp/pr12-qa-report.json', JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(err => {
            report.fatal = String(err && err.stack || err);
            fs.writeFileSync('/tmp/pr12-qa-report.json', JSON.stringify(report,null,2));
            console.error(report.fatal);
            process.exit(1);
          });
          NODE
          node /tmp/pr12-qa.cjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr12-final-qa-report
          path: /tmp/pr12-qa-report.json
          if-no-files-found: ignore

      - name: Remove one-time workflow after successful QA
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr12-final-qa.yml
          git add -A
          git commit -m "Remove one-time PR12 final QA workflow"
          git push origin HEAD:hotfix/production-ui-fixes-24aug
