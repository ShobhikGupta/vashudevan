name: VMG Intelligence CI

on:
  pull_request:
    paths:
      - "intelligence/**"
      - "netlify/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "agent-playbooks/vmg-intelligence/**"
      - ".github/workflows/vmg-intelligence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
