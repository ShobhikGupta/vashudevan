            <div class="vmg-footer-trust-card" data-logo-key="iec"><div class="vmg-footer-trust-logo"><img src="/assets/img/footer-logos/iec.png" alt="IEC logo" loading="lazy"></div><div class="vmg-footer-trust-copy"><strong>IEC</strong><span>IEC Registered</span></div></div>
            <div class="vmg-footer-trust-card" data-logo-key="gst"><div class="vmg-footer-trust-logo"><img src="/assets/img/footer-logos/gst.png" alt="GST logo" loading="lazy"></div><div class="vmg-footer-trust-copy"><strong>GST</strong><span>GSTIN 24AARFV7153Q1Z7</span></div></div>
            <div class="vmg-footer-trust-card" data-logo-key="msme"><div class="vmg-footer-trust-logo"><img src="/assets/img/footer-logos/msme.png" alt="MSME logo" loading="lazy"></div><div class="vmg-footer-trust-copy"><strong>MSME</strong><span>MSME Registered</span></div></div>
          </div>
        </div>
      </div>
      <div class="vmg-footer-main">
        <div class="vmg-footer-wrap vmg-footer-main-inner">
