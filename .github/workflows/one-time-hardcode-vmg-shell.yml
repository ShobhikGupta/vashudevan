            <div class="vmg-footer-trust-card" data-logo-key="bir"><div class="vmg-footer-trust-logo"><img src="/assets/img/footer-logos/bir.png" alt="BIR logo" loading="lazy"></div><div class="vmg-footer-trust-copy"><strong>BIR</strong><span>Member</span></div></div>
            <div class="vmg-footer-trust-card" data-logo-key="recycleinme"><div class="vmg-footer-trust-logo"><img src="/assets/img/footer-logos/recycleinme.png" alt="RecycleInMe logo" loading="lazy"></div><div class="vmg-footer-trust-copy"><strong>RecycleInMe</strong><span>Premium Member</span></div></div>
          </div>
