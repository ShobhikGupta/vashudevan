    branches:
      - chatgpt/mobile-fixes-21aug
    paths:
      - .github/workflows/one-time-hardcode-vmg-shell.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
