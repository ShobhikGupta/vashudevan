          footer = f'''<footer class="site-footer vmg-global-footer" data-vmg-static-footer="true">
      <div class="vmg-footer-trust-zone">
        <div class="vmg-footer-wrap">
          <h2 class="vmg-footer-section-title">Proud Member Of</h2>
