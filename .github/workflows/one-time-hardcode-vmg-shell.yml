          style_block = '''
    <link rel="stylesheet" href="/assets/css/vmg-trade-nav.css" data-vmg-trade-nav="true">
    <link rel="stylesheet" href="/assets/css/vmg-nav-premium-overrides.css" data-vmg-nav-premium="true">
    <link rel="stylesheet" href="/assets/css/vmg-feedback.css" data-vmg-feedback-style="true">
    <link rel="stylesheet" href="/assets/css/vmg-footer.css" data-vmg-footer-style="true">
    <link rel="stylesheet" href="/assets/css/vmg-responsive-polish.css?v=20260821g" data-vmg-responsive-polish="true">
    <link rel="stylesheet" href="/assets/css/vmg-header-sticky-fix.css?v=20260822a" data-vmg-header-sticky-fix="true">'''

          pages = sorted(repo.glob('*.html'))
          market_page = repo / 'market-prices' / 'index.html'
          if market_page.exists(): pages.append(market_page)

          for path in pages:
              text = path.read_text()
              original = text

              # Hardcode shell CSS in <head> so the approved design exists on the very first paint.
              if 'data-vmg-trade-nav="true"' not in text:
                  text = text.replace('</head>', style_block + '\n  </head>', 1)

              text, hc = re.subn(r'<header\b[^>]*class="[^"]*site-header[^"]*"[^>]*>.*?</header>', header, text, count=1, flags=re.S | re.I)
              if hc != 1:
                  print('WARN header not replaced:', path)

              text, fc = re.subn(r'<footer\b[^>]*class="[^"]*site-footer[^"]*"[^>]*>.*?</footer>', footer, text, count=1, flags=re.S | re.I)
              if fc != 1:
                  print('WARN footer not replaced:', path)

              # Use the same brochure terminology everywhere visible.
              text = text.replace('Preview Company Profile', 'Preview VMG Brochure')
              text = text.replace('Download Company Profile', 'Download VMG Brochure')
              text = text.replace('View Company Profile', 'View VMG Brochure')

              # Force fresh shell loader after this structural change.
              text = re.sub(r'assets/js/config\.js(?:\?v=[^"\']+)?', '/assets/js/config.js?v=20260822a', text)

              if text != original:
                  path.write_text(text)

          # Rewrite config.js: it may bind behavior but must NEVER rebuild the shell again.
          config = repo / 'assets/js/config.js'
          config.write_text(r'''// VMG static-site client configuration. Header/footer markup is hardcoded in HTML.
(function(){
  window.AppConfig = window.AppConfig || {};
  window.AppConfig.googleScriptUrl = 'https://script.google.com/macros/s/AKfycbxsmNbhUkhWY3hEmYof4dGi7cOEYEbMDoBSFe3erSciipp-_-tI1RKuQ7P3ms9gyYYR/exec';
  window.AppConfig.contactEndpoint = window.AppConfig.contactEndpoint || '';
})();

(function(){
  if (!document || !document.head) return;
  function loadScript(src, marker){
    if (document.querySelector('script[' + marker + ']')) return;
    var script = document.createElement('script');
    script.src = src;
    script.async = false;
    script.setAttribute(marker, 'true');
    document.head.appendChild(script);
  }
  loadScript('/assets/js/vmg-feedback.js?v=20260822a', 'data-vmg-feedback-script');
  loadScript('/assets/js/vmg-help.js?v=20260822a', 'data-vmg-help-script');
})();

(function(){
  'use strict';

  function ensureToast(){
    var toast = document.querySelector('.vmg-track-toast');
    if (toast) return toast;
    toast = document.createElement('div');
    toast.className = 'vmg-track-toast';
    toast.setAttribute('role','status');
    toast.setAttribute('aria-live','polite');
    document.body.appendChild(toast);
    return toast;
  }

  function bindTrackForms(){
    var toast = ensureToast();
    var timer = null;
    document.querySelectorAll('[data-vmg-track-form]').forEach(function(form){
      if (form.dataset.bound === 'true') return;
      form.dataset.bound = 'true';
      form.addEventListener('submit', function(event){
        event.preventDefault();
        var input = form.querySelector('.vmg-track-input');
        toast.textContent = input && input.value.trim()
          ? 'Shipment tracking portal is coming soon. Your reference has not been submitted.'
          : 'Shipment tracking portal is coming soon.';
        toast.classList.add('is-visible');
        window.clearTimeout(timer);
        timer = window.setTimeout(function(){ toast.classList.remove('is-visible'); }, 3200);
      });
    });
  }

  function setActiveNav(){
    var path = (window.location.pathname || '/').replace(/\/$/, '') || '/';
    document.querySelectorAll('#site-nav > ul > li > a[data-vmg-nav-path]').forEach(function(link){
      link.removeAttribute('aria-current');
      var key = link.getAttribute('data-vmg-nav-path');
      var match =
        (key === 'home' && (path === '/' || path === '/index.html')) ||
        (key === 'products' && (path === '/products.html' || path === '/product.html')) ||
        (key === 'market' && (path === '/market-prices' || path === '/market-prices/index.html')) ||
        (key === 'resources' && (path === '/resources.html' || path === '/faq.html')) ||
        (key === 'contact' && path === '/contact.html');
      if (match) link.setAttribute('aria-current','page');
    });
  }

  function updateHeader(){
    var header = document.querySelector('.site-header.vmg-econship-header');
    if (!header) return;
    var footer = document.querySelector('footer.vmg-global-footer');
    var nav = document.getElementById('site-nav');
    var desktop = window.matchMedia('(min-width: 992px)').matches;
    var menuOpen = document.body.classList.contains('menu-open') || (nav && nav.classList.contains('open'));
    header.classList.toggle('vmg-desktop-tier1-hidden', desktop && window.scrollY > 8);
    var footerVisible = false;
    if (footer) {
      var rect = footer.getBoundingClientRect();
      footerVisible = rect.top < window.innerHeight && rect.bottom > 0;
    }
    header.classList.toggle('vmg-footer-in-view', footerVisible && !menuOpen);
  }

  function init(){
    bindTrackForms();
    setActiveNav();
    updateHeader();
    var raf = 0;
    function requestUpdate(){
      if (raf) return;
      raf = window.requestAnimationFrame(function(){ raf = 0; updateHeader(); });
    }
    window.addEventListener('scroll', requestUpdate, {passive:true});
    window.addEventListener('resize', requestUpdate, {passive:true});
    document.addEventListener('click', function(){ window.setTimeout(requestUpdate, 0); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true});
  else init();
})();
''')

          # Footer JS becomes behavior-only. It must never replace hardcoded markup.
          footer_js = repo / 'assets/js/vmg-footer.js'
          footer_js.write_text(r'''(function(){
  'use strict';
  function bindSubscribe(footer){
    var form = footer && footer.querySelector('[data-vmg-subscribe-form]');
    if (!form || form.dataset.bound === 'true') return;
    form.dataset.bound = 'true';
    var input = form.querySelector('.vmg-footer-subscribe-input');
    var button = form.querySelector('.vmg-footer-subscribe-button');
    var status = form.querySelector('.vmg-footer-subscribe-status');
    function clear(){ status.textContent=''; status.className='vmg-footer-subscribe-status'; input.setAttribute('aria-invalid','false'); }
    input.addEventListener('input', clear);
    form.addEventListener('submit', function(event){
      event.preventDefault(); clear();
      var email = (input.value || '').trim();
      if (!email || !input.checkValidity()) {
        status.textContent = email ? 'Please enter a valid business email.' : 'Please enter your business email.';
        status.classList.add('is-error'); input.setAttribute('aria-invalid','true'); input.focus(); return;
      }
      var endpoint = window.AppConfig && window.AppConfig.googleScriptUrl;
      if (!endpoint) { status.textContent='Subscription is temporarily unavailable.'; status.classList.add('is-error'); return; }
      button.disabled=true; button.textContent='Sending…'; status.textContent='Sending subscription request…';
      fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({source:'trade-updates-subscription',type:'Trade Updates Subscription',email:email,'MAIL ID':email,page:window.location.href,submittedAt:new Date().toISOString()})})
        .then(function(){ status.textContent='Thank you. Your subscription request was sent.'; status.classList.add('is-success'); form.reset(); })
        .catch(function(){ status.textContent='Could not send the request. Please try again.'; status.classList.add('is-error'); })
        .finally(function(){ button.disabled=false; button.textContent='Subscribe'; });
    });
  }
  function init(){ bindSubscribe(document.querySelector('footer.vmg-global-footer')); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',init,{once:true}); else init();
})();
''')

          # Static feedback buttons are already in HTML. Bind them instead of injecting replacements.
          fb = repo / 'assets/js/vmg-feedback.js'
          f = fb.read_text()
          f = re.sub(r"^\(function\(\)\{.*?\}\)\(\);\n\n", "", f, count=1, flags=re.S)
          f = f.replace(
              "  function createTrigger(extraClass) {\n    var button = document.createElement('button');",
              "  function bindTrigger(button) {\n    if (!button || button.dataset.vmgFeedbackBound === 'true') return button;\n    button.dataset.vmgFeedbackBound = 'true';\n    button.addEventListener('click', function () {\n      if (window.innerWidth <= 991) {\n        var nav = document.getElementById('site-nav');\n        var toggle = document.querySelector('.nav-toggle');\n        if (nav && nav.classList.contains('open') && toggle) {\n          toggle.click();\n          window.setTimeout(function () { openDrawer(button); }, 170);\n          return;\n        }\n      }\n      openDrawer(button);\n    });\n    return button;\n  }\n\n  function createTrigger(extraClass) {\n    var button = document.createElement('button');"
          )
          # Remove the original duplicated click handler inside createTrigger and return via binder.
          f = re.sub(r"\n    button\.addEventListener\('click', function \(\) \{.*?\n    \}\);\n    return button;", "\n    return bindTrigger(button);", f, count=1, flags=re.S)
          f = f.replace("  function addTriggers() {\n", "  function addTriggers() {\n    document.querySelectorAll('.vmg-feedback-trigger').forEach(bindTrigger);\n")
          # Load footer behavior only; structure is static.
          f = "(function(){ if(document && document.head && !document.querySelector('script[data-vmg-footer-script]')){ var s=document.createElement('script'); s.src='/assets/js/vmg-footer.js?v=20260822a'; s.async=false; s.setAttribute('data-vmg-footer-script','true'); document.head.appendChild(s); }})();\n\n" + f
          fb.write_text(f)

          # Final static header CSS: no offset calculations, no observer, no competing fixed nav.
          shell_css = repo / 'assets/css/vmg-header-sticky-fix.css'
          shell_css.write_text(r'''/* VMG hardcoded shell behavior — 22 Aug 2026 */
.site-header.vmg-econship-header {
  position: sticky !important;
  top: 0 !important;
