          <div class="vmg-footer-subscribe-row"><div class="vmg-footer-subscribe-copy"><strong>VMG Trade Updates</strong><span>Occasional recyclable-metal market updates.</span></div><form class="vmg-footer-subscribe-form" data-vmg-subscribe-form novalidate><div class="vmg-footer-subscribe-controls"><input class="vmg-footer-subscribe-input" type="email" name="email" autocomplete="email" placeholder="Business email address" aria-label="Business email address" aria-describedby="vmg-footer-subscribe-status" aria-invalid="false" required><button class="vmg-footer-subscribe-button" type="submit">Subscribe</button></div><p class="vmg-footer-subscribe-status" id="vmg-footer-subscribe-status" role="status" aria-live="polite"></p></form></div>
          <div class="vmg-footer-bottom"><a class="vmg-footer-brand-lockup" href="/index.html"><strong>Vashudevan MetGlobal LLP</strong></a><span class="vmg-footer-copyright">© 2026 Vashudevan MetGlobal LLP. All rights reserved.</span><div class="vmg-footer-socials"><a href="https://wa.me/919879208178" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">{whatsapp_svg}</a><a href="https://www.facebook.com/profile.php?id=61577681908111" target="_blank" rel="noopener noreferrer" aria-label="Facebook">{facebook_svg}</a><a href="https://www.linkedin.com/company/109161337/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">{linkedin_svg}</a><a href="https://www.instagram.com/vashudevan_metglobal_llp?igsh=NWJrZjQ3MTNqdTU4&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram">{instagram_svg}</a></div></div>
