name: PR12 popup single-render fix

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/pr12-popup-single-render.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Consolidate opening popup into one premium render path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('assets/js/main.js')
          main = main_path.read_text(encoding='utf-8')

          old_card_setup = """    var card = document.createElement('div');
    card.className = 'opening-popup-card';
    card.setAttribute('role', 'dialog');"""
          new_card_setup = """    var card = document.createElement('div');
    card.className = 'opening-popup-card';
    card.dataset.vmgPremiumPopup = 'true';
    card.setAttribute('role', 'dialog');"""
          if main.count(old_card_setup) != 1:
              raise SystemExit(f'Expected one popup card setup, found {main.count(old_card_setup)}')
          main = main.replace(old_card_setup, new_card_setup, 1)

          old_header = '''      <div class="opening-popup-header">
        <div>
          <h3 class="opening-popup-title">Let's Stay Connected</h3>
          <p class="opening-popup-subtitle">Please share your details so we can reach you better.</p>
        </div>
        <button type="button" class="opening-popup-close" aria-label="Close">×</button>
      </div>'''

          new_header = '''      <div class="opening-popup-header">
        <div class="opening-popup-brand">
          <img class="opening-popup-brand-logo" src="/assets/img/vmg-open-graph.png" alt="Vashudevan MetGlobal LLP logo" decoding="async">
          <div class="opening-popup-contact-row" aria-label="Vashudevan contact details">
            <span class="opening-popup-contact-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 5.75h16.5v12.5H3.75z"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
              <span>exim@vashudevan.com</span>
            </span>
            <span class="opening-popup-contact-separator" aria-hidden="true"></span>
            <span class="opening-popup-contact-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.3 3.75 4.8 6.15c-.6.6-.72 1.5-.3 2.25 2.55 4.55 6.1 8.1 10.65 10.65.75.42 1.65.3 2.25-.3l2.4-2.5-4-3.1-1.9 1.9c-2.2-1.25-3.95-3-5.2-5.2l1.9-1.9-3.3-4.2Z"/></svg>
              <span>+91 9879208178</span>
            </span>
          </div>
        </div>
        <div>
          <h3 class="opening-popup-title">Let's Stay Connected</h3>
          <p class="opening-popup-subtitle">Please share your details so we can reach you better.</p>
        </div>
        <button type="button" class="opening-popup-close" aria-label="Close">×</button>
      </div>'''

          if main.count(old_header) != 1:
              raise SystemExit(f'Expected one plain popup header, found {main.count(old_header)}')
          main = main.replace(old_header, new_header, 1)
          main_path.write_text(main, encoding='utf-8')

          styles_path = Path('assets/css/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          marker = '/* VMG opening popup premium final render — PR12 single source */'
          if marker not in styles:
              styles += r'''

/* VMG opening popup premium final render — PR12 single source */
.opening-popup-card{border:1px solid rgba(16,24,40,.10)!important;border-radius:14px!important;box-shadow:0 24px 70px rgba(15,23,42,.22),0 4px 14px rgba(15,23,42,.07)!important;background:#fff!important}
.opening-popup-header{display:block!important;position:relative!important;text-align:center!important}
.opening-popup-header>div:not(.opening-popup-brand){width:100%!important;text-align:center!important}
.opening-popup-brand{width:100%;text-align:center;margin:0 auto 14px;padding:0 0 13px;border-bottom:1px solid #e8eaed}
.opening-popup-brand-logo{display:block;width:100%;max-width:282px;height:auto;object-fit:contain;object-position:center;margin:0 auto 9px}
.opening-popup-contact-row{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;color:#667085;font-size:11.5px;font-weight:500;line-height:1.2;letter-spacing:-.01em;white-space:nowrap}
.opening-popup-contact-item{display:inline-flex;align-items:center;gap:6px;min-width:0}
.opening-popup-contact-item svg{width:17px;height:17px;flex:0 0 17px;stroke:#b6542a;stroke-width:1.65;fill:none}
.opening-popup-contact-separator{width:1px;height:17px;background:#e2e5e9;flex:0 0 1px}
.opening-popup-title{margin:0 0 4px!important;color:#101828!important;font-size:18px!important;line-height:1.2!important;font-weight:750!important;letter-spacing:-.025em!important}
.opening-popup-subtitle{margin:0 0 10px!important;color:#737d8d!important;font-size:12.5px!important;line-height:1.45!important;font-weight:400!important}
.opening-popup-close{top:0!important;right:0!important;width:28px!important;height:28px!important;display:grid!important;place-items:center!important;padding:0!important;color:#667085!important;font-size:19px!important;border-radius:8px!important;z-index:3!important}
.opening-popup-close:hover{background:#f5f6f7!important;color:#344054!important}
.opening-popup-submit:disabled{background:#e9ebef!important;color:#98a2b3!important;box-shadow:none!important}
.opening-popup-turnstile-field{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;margin:0!important;padding:0!important;border:0!important}
@media(max-width:430px){.opening-popup-brand{margin-bottom:12px;padding-bottom:11px}.opening-popup-brand-logo{max-width:238px;height:auto;margin-bottom:8px}.opening-popup-contact-row{gap:7px;font-size:10.25px}.opening-popup-contact-item{gap:4px}.opening-popup-contact-item svg{width:15px;height:15px;flex-basis:15px}.opening-popup-contact-separator{height:15px}}
@media(max-width:360px){.opening-popup-contact-row{font-size:9.7px;gap:5px}.opening-popup-contact-item{gap:3px}}
'''
              styles_path.write_text(styles, encoding='utf-8')

          submit_path = Path('assets/js/vmg-submit-state.js')
          submit = submit_path.read_text(encoding='utf-8')
          premium_loader = "  load('/assets/js/vmg-popup-premium.js?v=20260905c', 'data-vmg-popup-premium');\n"
          if submit.count(premium_loader) != 1:
              raise SystemExit(f'Expected one premium enhancer loader, found {submit.count(premium_loader)}')
          submit = submit.replace(premium_loader, '', 1)
          submit_path.write_text(submit, encoding='utf-8')

          premium_path = Path('assets/js/vmg-popup-premium.js')
          premium_path.write_text("""(function () {\n  'use strict';\n  // Compatibility stub only. The opening popup is rendered directly in its\n  // final premium structure by main.js; no post-render DOM enhancement occurs.\n})();\n""", encoding='utf-8')

          # Acceptance-oriented source checks.
          main = main_path.read_text(encoding='utf-8')
          submit = submit_path.read_text(encoding='utf-8')
          premium = premium_path.read_text(encoding='utf-8')
          if main.count("class=\"opening-popup-brand\"") != 1:
              raise SystemExit('Premium brand must exist exactly once in main.js popup markup')
          if "card.dataset.vmgPremiumPopup = 'true';" not in main:
              raise SystemExit('Premium-ready marker missing before DOM insertion')
          if 'vmg-popup-premium.js' in submit:
              raise SystemExit('Legacy premium enhancer is still actively loaded')
          if 'MutationObserver' in premium or 'function enhance' in premium:
              raise SystemExit('Legacy post-render enhancer still exists')
          if 'SHOW_DELAY_MS = 2000' not in main or 'REOPEN_DELAY_MS = 45000' not in main:
              raise SystemExit('Popup timing constants changed unexpectedly')

          print('main opening-popup-card creation count:', main.count("card.className = 'opening-popup-card'"))
          print('main premium brand markup count:', main.count('class="opening-popup-brand"'))
          print('legacy premium loader active:', 'vmg-popup-premium.js' in submit)
          print('legacy premium observer active:', 'MutationObserver' in premium)
          PY

          node --check assets/js/main.js
          node --check assets/js/vmg-submit-state.js
          node --check assets/js/vmg-popup-premium.js
          git diff --check
          git status --short
          git diff --stat

      - name: Commit popup single-render fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/main.js assets/css/styles.css assets/js/vmg-submit-state.js assets/js/vmg-popup-premium.js
          git diff --cached --check
          git commit -m 'Render opening popup directly in premium layout'
          git push origin HEAD:hotfix/production-ui-fixes-24aug
