name: PR12 VMG PNG browser verification

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-fix-header-behavior.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Verify live preview image and popup in Chrome
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='https://deploy-preview-12--exquisite-hotteok-531d58.netlify.app'
          echo "Chrome: $(google-chrome --version || chromium --version)"
          curl -fLsS -D /tmp/vmg-headers -o /tmp/vmg-open-graph.png "$PREVIEW/assets/img/vmg-open-graph.png"
          awk 'NR==1 || tolower($0) ~ /^content-type:/' /tmp/vmg-headers | tr -d '\r'
          file /tmp/vmg-open-graph.png
          sha256sum /tmp/vmg-open-graph.png
          python -m pip install -q selenium
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          preview = 'https://deploy-preview-12--exquisite-hotteok-531d58.netlify.app/'
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=options)
          try:
              driver.get(preview)
              driver.execute_script('try { localStorage.clear(); sessionStorage.clear(); } catch(e) {}')
              driver.refresh()
              WebDriverWait(driver, 12).until(EC.presence_of_element_located((By.CSS_SELECTOR, '.opening-popup-brand-logo')))
              result = driver.execute_script('''
                const img = document.querySelector('.opening-popup-brand-logo');
                const og = document.querySelector('meta[property="og:image"]');
                const tw = document.querySelector('meta[name="twitter:image"]');
                return {
                  popup: !!document.querySelector('.opening-popup-card'),
                  src: img && img.getAttribute('src'),
                  complete: !!(img && img.complete),
                  naturalWidth: img ? img.naturalWidth : 0,
                  naturalHeight: img ? img.naturalHeight : 0,
                  og: og ? og.content : null,
                  twitter: tw ? tw.content : null
                };
              ''')
              print('BROWSER_RESULT=' + json.dumps(result, sort_keys=True))
              assert result['popup'] is True
              assert result['src'] == '/assets/img/vmg-open-graph.png'
              assert result['complete'] is True
              assert result['naturalWidth'] > 0
              assert result['naturalHeight'] > 0
              assert result['og'] == 'https://vashudevan.com/assets/img/vmg-open-graph.png'
              assert result['twitter'] == 'https://vashudevan.com/assets/img/vmg-open-graph.png'
              driver.save_screenshot('/tmp/vmg-popup.png')
          finally:
              driver.quit()
          PY

          test "$(grep -R --exclude-dir=.git --exclude='one-time-fix-header-behavior.yml' -l 'vmg-open-graph\.jpg' . | wc -l)" = '0'
          git diff --check origin/main...HEAD
          git status --short
          git diff --stat origin/main...HEAD

      - name: Restore original workflow byte-for-byte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/one-time-fix-header-behavior.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-fix-header-behavior.yml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'Restore existing header workflow after VMG browser QA'
          git push origin HEAD:hotfix/production-ui-fixes-24aug
