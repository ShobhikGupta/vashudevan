name: One-time robust header behavior fix

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-fix-header-behavior.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Apply prepared country phone patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow = Path('.github/workflows/one-time-country-phone-routing-fix.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('Prepared Python patch not found')
          code = textwrap.dedent(match.group(1))
          exec(compile(code, 'country-phone-routing-patch', 'exec'), {'__name__':'__main__'})
          PY

          node --check assets/js/vmg-country-phone.js
          node --check assets/js/contact-form.js
          node --check assets/js/main.js
          git diff --check
          grep -q "phoneDisplay" assets/js/contact-form.js
          grep -q "phoneDisplay" assets/js/main.js
          ! grep -q "Country list is still initializing" assets/js/contact-form.js
          ! grep -q "Phone validation is still loading" assets/js/contact-form.js
          test $(grep -o '"value"' assets/js/vmg-country-phone.js | wc -l) -ge 195

          git checkout origin/main -- .github/workflows/one-time-fix-header-behavior.yml
          rm -f .github/workflows/one-time-country-phone-routing-fix.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify country phone logic and prepare Sheet routing"
          git push origin HEAD:hotfix/production-ui-fixes-24aug
