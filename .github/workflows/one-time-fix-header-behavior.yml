name: One-time robust header behavior fix
on:
  push:
    branches: [hotfix/production-ui-fixes-24aug]
    paths: [.github/workflows/one-time-fix-header-behavior.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0
      - name: Static checks
        run: |
          node --check assets/js/vmg-country-phone.js
          node --check assets/js/vmg-country-phone-bridge.js
          node --check assets/js/contact-form-v2.js
          node --check assets/js/contact-page-shell.js
          node --check assets/js/vmg-submit-state.js
          git diff --check origin/main...HEAD
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Contact diagnostics
        run: |
          python3 -m http.server 8000 >/tmp/vmg-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/diag.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            page.on('pageerror',e=>console.log('PAGEERROR',String(e)));
            await page.route('https://cdn.jsdelivr.net/**',r=>r.abort());
            await page.route('https://challenges.cloudflare.com/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.addInitScript(()=>{window.turnstile={render(host,opts){host.innerHTML='<div>QA Turnstile</div>';setTimeout(()=>opts.callback&&opts.callback('qa-token'),10);return 'qa';},reset(){}};});
            let captured=null;
            await page.route('http://127.0.0.1:8000/qa-contact',async route=>{captured=route.request().postData();console.log('CAPTURED',captured);await route.fulfill({status:200,contentType:'application/json',body:'{"success":true}'});});
            await page.goto('http://127.0.0.1:8000/contact.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#contact-form')?.dataset.vmgV2Bound==='true');
            await page.selectOption('#country','india');
            await page.fill('#fullname','QA Test User');
            await page.fill('#emailID','qa@example.com');
            await page.fill('#contact','9316571362');
            await page.selectOption('#type','general');
            await page.fill('#message','This is a valid browser QA enquiry message.');
            await page.check('#privacy');
            await page.evaluate(()=>{window.AppConfig.contactSecurityReady=true;window.AppConfig.contactEndpoint='http://127.0.0.1:8000/qa-contact';});
            await page.waitForTimeout(100);
            console.log('BEFORE',await page.evaluate(()=>({valid:document.getElementById('contact-form').checkValidity(),country:country.value,dial:document.getElementById('contact-dial-code').textContent,phone:contact.value,type:type.value,turnText:document.getElementById('contact-turnstile').innerText})));
            await page.locator('#contact-form .submit-btn').click();
            await page.waitForTimeout(1000);
            const state=await page.evaluate(()=>({result:document.getElementById('form-result').textContent,resultClass:document.getElementById('form-result').className,errors:[...document.querySelectorAll('#contact-form .error.show')].map(x=>({id:x.id,text:x.textContent})),phoneError:document.getElementById('contact-error')?.textContent,submitClass:document.querySelector('#contact-form .submit-btn').className,submitDisabled:document.querySelector('#contact-form .submit-btn').disabled,country:document.getElementById('country').value,dial:document.getElementById('contact-dial-code').textContent})));
            console.log('AFTER',JSON.stringify(state));
            if(!captured) throw new Error('No request captured: '+JSON.stringify(state));
            const body=JSON.parse(captured);
            if(body.phoneDisplay!=='+91 9316571362'||body.phoneE164!=='+919316571362')throw new Error('Bad phone payload '+captured);
            if(state.phoneError)throw new Error('Phone error after valid India submission '+state.phoneError);
            console.log('CONTACT_PASS',body.phoneDisplay);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/diag.cjs
