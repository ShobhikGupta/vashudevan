name: PR12 popup OG and Turnstile wiring

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-fix-header-behavior.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Decode uploaded logo and patch static metadata/backend config
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          # 1) Decode the exact uploaded horizontal VMG artwork (optimized JPEG snapshot)
          staged = Path('assets/img/.vmg-open-graph.jpg.b64')
          target = Path('assets/img/vmg-open-graph.jpg')
          target.write_bytes(base64.b64decode(staged.read_text().strip()))
          staged.unlink()

          # 2) Use the stored horizontal logo in the premium popup header.
          premium = Path('assets/js/vmg-popup-premium.js')
          s = premium.read_text()
          s = s.replace('/assets/img/LOGO.png', '/assets/img/vmg-open-graph.jpg')
          premium.write_text(s)

          # 3) Add static Open Graph/Twitter metadata to public HTML entry pages.
          title = 'Vashudevan Met Global LLP'
          desc = 'Global recyclable-metal supply-chain solutions. Recycle. Resource. Responsibly.'
          image = 'https://vashudevan.com/assets/img/vmg-open-graph.jpg'
          meta = f'''\n    <meta property="og:type" content="website">\n    <meta property="og:site_name" content="{title}">\n    <meta property="og:title" content="{title}">\n    <meta property="og:description" content="{desc}">\n    <meta property="og:image" content="{image}">\n    <meta property="og:image:alt" content="Vashudevan Met Global LLP logo">\n    <meta name="twitter:card" content="summary_large_image">\n    <meta name="twitter:title" content="{title}">\n    <meta name="twitter:description" content="{desc}">\n    <meta name="twitter:image" content="{image}">'''

          pages = [
              Path('index.html'), Path('who-we-are.html'), Path('our-impact.html'),
              Path('products.html'), Path('product.html'), Path('resources.html'),
              Path('faq.html'), Path('contact.html'), Path('privacy-policy.html'),
              Path('disclaimer.html'), Path('market-prices/index.html')
          ]
          for page in pages:
              if not page.exists():
                  continue
              html = page.read_text()
              # Remove any prior VMG OG/Twitter block fields so each page has one canonical set.
              html = re.sub(r'\n\s*<meta\s+(?:property|name)="(?:og:[^"]+|twitter:[^"]+)"[^>]*>', '', html, flags=re.I)
              if '</head>' not in html:
                  raise RuntimeError(f'Missing </head> in {page}')
              html = html.replace('</head>', meta + '\n  </head>', 1)
              page.write_text(html)

          # 4) Make separate visible-contact and invisible-popup public sitekey slots explicit.
          config = Path('assets/js/config.js')
          cfg = config.read_text()
          anchor = "  window.AppConfig.gaMeasurementId = 'G-6CJ7X607D5';"
          addition = "\n  window.AppConfig.turnstileSiteKey = window.AppConfig.turnstileSiteKey || '';\n  window.AppConfig.popupTurnstileSiteKey = window.AppConfig.popupTurnstileSiteKey || '';"
          if 'popupTurnstileSiteKey' not in cfg:
              if anchor not in cfg:
                  raise RuntimeError('Config insertion anchor missing')
              cfg = cfg.replace(anchor, anchor + addition, 1)
              config.write_text(cfg)

          # 5) Support separate Turnstile secrets for the two widget modes server-side.
          backend = Path('WEBSITE_MESSAGES_APPS_SCRIPT_FINAL.gs')
          gs = backend.read_text()
          gs = gs.replace(
              '  Required Script Properties:\n    TURNSTILE_SECRET_KEY\n    CONTACT_UPLOAD_FOLDER_ID',
              '  Required Script Properties:\n    CONTACT_TURNSTILE_SECRET_KEY\n    POPUP_TURNSTILE_SECRET_KEY\n    CONTACT_UPLOAD_FOLDER_ID\n\n  Compatibility fallback (optional during migration):\n    TURNSTILE_SECRET_KEY'
          )
          old = '''function vmgVerifyTurnstile_(token, expectedAction) {\n  var secret = PropertiesService.getScriptProperties().getProperty('TURNSTILE_SECRET_KEY');\n  if (!secret) return { ok: false, message: 'Security verification is not configured.' };\n  token = vmgNormalize_(token, 4096);'''
          new = '''function vmgTurnstileSecret_(expectedAction) {\n  var props = PropertiesService.getScriptProperties();\n  if (expectedAction === 'popup_form') {\n    return props.getProperty('POPUP_TURNSTILE_SECRET_KEY') || props.getProperty('TURNSTILE_SECRET_KEY') || '';\n  }\n  if (expectedAction === 'contact_form') {\n    return props.getProperty('CONTACT_TURNSTILE_SECRET_KEY') || props.getProperty('TURNSTILE_SECRET_KEY') || '';\n  }\n  return '';\n}\n\nfunction vmgVerifyTurnstile_(token, expectedAction) {\n  var secret = vmgTurnstileSecret_(expectedAction);\n  if (!secret) return { ok: false, message: 'Security verification is not configured.' };\n  token = vmgNormalize_(token, 4096);'''
          if old not in gs:
              raise RuntimeError('Turnstile verifier anchor missing')
          gs = gs.replace(old, new, 1)
          backend.write_text(gs)

          # Basic assertions.
          assert target.exists() and target.stat().st_size > 10000
          assert 'vmg-open-graph.jpg' in Path('index.html').read_text()
          assert 'popupTurnstileSiteKey' in config.read_text()
          assert 'POPUP_TURNSTILE_SECRET_KEY' in backend.read_text()
          PY

      - name: Commit PR-only implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Wire popup logo, OG image and split Turnstile config"
          git push origin HEAD:hotfix/production-ui-fixes-24aug
