name: PR12 exact VMG PNG transfer test

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-fix-header-behavior.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test exact uploaded PNG delivery paths
        shell: bash
        run: |
          set +e
          EXPECT='6976461f6b6ae2eafd9fbed50f5b74b61f4f03c75c8944fc1d4e7f046172db82'
          URL1='https://drive.usercontent.google.com/download?id=1w0Boz6ooSSWg92Y45lyczacaoAlI4E29&export=download&confirm=t'
          URL2='https://drive.google.com/uc?export=download&id=1w0Boz6ooSSWg92Y45lyczacaoAlI4E29&confirm=t'
          URL3='https://drive.google.com/uc?id=1w0Boz6ooSSWg92Y45lyczacaoAlI4E29&export=download'
          for n in 1 2 3; do
            eval "u=\$URL$n"
            echo "--- drive candidate $n ---"
            code=$(curl -sS -L -w '%{http_code}' -o "/tmp/d$n" "$u")
            echo "HTTP=$code"
            file "/tmp/d$n" || true
            wc -c "/tmp/d$n" || true
            sha256sum "/tmp/d$n" || true
            python -c "import struct,sys; b=open(sys.argv[1],'rb').read(24); print('PNG_DIMS=%dx%d' % struct.unpack('>II',b[16:24]) if len(b)>=24 and b[:8]==b'\\x89PNG\\r\\n\\x1a\\n' else 'NOT_PNG')" "/tmp/d$n" || true
          done
          echo "EXPECTED_SHA256=$EXPECT"
