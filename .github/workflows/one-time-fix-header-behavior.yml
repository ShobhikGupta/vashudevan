name: Restore original workflow after PR12 image fix

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-fix-header-behavior.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0
      - name: Restore workflow byte-for-byte from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/one-time-fix-header-behavior.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-fix-header-behavior.yml
          git diff --cached --check
          git commit -m 'Restore existing header workflow after VMG image fix'
          git push origin HEAD:hotfix/production-ui-fixes-24aug
