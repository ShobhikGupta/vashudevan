name: PR12 combined header logo swap

on:
  push:
    branches:
      - hotfix/production-ui-fixes-24aug
    paths:
      - .github/workflows/one-time-fix-header-behavior.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-ui-fixes-24aug
          fetch-depth: 0

      - name: Replace split header brand with combined image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, struct, hashlib

          pages = [
              Path('index.html'),
              Path('contact.html'),
              Path('who-we-are.html'),
              Path('our-impact.html'),
              Path('products.html'),
              Path('product.html'),
              Path('resources.html'),
              Path('faq.html'),
              Path('privacy-policy.html'),
              Path('disclaimer.html'),
              Path('market-prices/index.html'),
              Path('includes/vmg-header.html'),
          ]

          pattern = re.compile(
              r'<a class="logo" href="/index\.html" aria-label="Vashudevan MetGlobal LLP home">\s*'
              r'<img class="vmg-updated-header-logo" src="/assets/img/vmg-header-logo\.svg" alt="Vashudevan MetGlobal LLP logo" width="48" height="64">\s*'
              r'<span>Vashudevan MetGlobal LLP</span>\s*'
              r'</a>'
          )

          replacement = '''<a class="logo vmg-logo-combined" href="/index.html" aria-label="Vashudevan MetGlobal LLP home">
        <img class="vmg-header-logo-combined" src="/assets/img/vmg-header-logo-combined.png" alt="Vashudevan MetGlobal LLP">
      </a>'''

          for path in pages:
              text = path.read_text(encoding='utf-8')
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one split header brand in {path}, found {count}')
              path.write_text(text, encoding='utf-8')

          # The user-uploaded 2048x682 PNG is byte-identical to the existing PR OG image,
          # so copy those exact bytes to the dedicated header asset path.
          src = Path('assets/img/vmg-open-graph.png')
          dst = Path('assets/img/vmg-header-logo-combined.png')
          data = src.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Source asset is not a valid PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (2048, 682):
              raise SystemExit(f'Unexpected source dimensions: {width}x{height}')
          dst.write_bytes(data)
          print('combined-logo sha256', hashlib.sha256(data).hexdigest())
          print('combined-logo dimensions', width, height)

          css_path = Path('assets/css/vmg-trade-nav.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* PR12 combined VMG header brand */'
          if marker in css:
              raise SystemExit('Combined header brand CSS already exists')
          css += r'''

/* PR12 combined VMG header brand */
.vmg-econship-header .logo.vmg-logo-combined {
  gap: 0;
  min-width: 0;
}

.vmg-econship-header .logo.vmg-logo-combined .vmg-header-logo-combined {
  display: block;
  width: clamp(190px, 18vw, 216px);
  max-width: 100%;
  height: auto;
  object-fit: contain;
  object-position: center;
  flex: 0 1 auto;
}

@media (max-width: 1100px) and (min-width: 992px) {
  .vmg-econship-header .logo.vmg-logo-combined .vmg-header-logo-combined {
    width: 190px;
    height: auto;
  }
}

@media (max-width: 991px) {
  .vmg-econship-header .logo.vmg-logo-combined .vmg-header-logo-combined {
    width: min(170px, calc(100vw - 92px));
    max-width: 100%;
    height: auto;
    flex: 0 1 auto;
  }
}

@media (max-width: 420px) {
  .vmg-econship-header .logo.vmg-logo-combined .vmg-header-logo-combined {
    width: min(154px, calc(100vw - 84px));
    height: auto;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')

          # Final scope checks.
          for path in pages:
              text = path.read_text(encoding='utf-8')
              if '/assets/img/vmg-header-logo.svg' in text:
                  raise SystemExit(f'Old split logo still active in {path}')
              if 'class="logo vmg-logo-combined"' not in text:
                  raise SystemExit(f'Combined logo missing in {path}')
              if '<span>Vashudevan MetGlobal LLP</span>' in text:
                  raise SystemExit(f'Old separate brand text still active in {path}')

          print('Updated header instances:', len(pages))
          PY

          git diff --check
          git status --short
          git diff --stat

      - name: Commit combined header logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/img/vmg-header-logo-combined.png \
            assets/css/vmg-trade-nav.css \
            includes/vmg-header.html \
            index.html contact.html who-we-are.html our-impact.html products.html product.html resources.html faq.html privacy-policy.html disclaimer.html market-prices/index.html
          git diff --cached --check
          git commit -m 'Use combined VMG image for header branding'
          git push origin HEAD:hotfix/production-ui-fixes-24aug
